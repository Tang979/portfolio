<footer style="background: var(--bg); border-top: 1px solid var(--glass-border);">
  <div class="max-w-7xl mx-auto px-6 py-8">
    <div class="flex flex-col md:flex-row items-center justify-between gap-4">

      <!-- Left: brand -->
      <div class="flex items-center gap-3">
        <!-- Controller icon matches the header and primary buttons -->
        <div style="width: 24px; height: 24px; border-radius: 5px; background: var(--text-primary);
                    display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--bg)"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="11" x2="10" y2="11"/>
            <line x1="8" y1="9" x2="8" y2="13"/>
            <line x1="15" y1="12" x2="15.01" y2="12"/>
            <line x1="18" y1="10" x2="18.01" y2="10"/>
            <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>
          </svg>
        </div>
        <span style="font-size: 0.82rem; color: var(--text-muted);">
          &copy; {{ now.Format "2006" }} TUANKHOA
          {{/*  &mdash;
          <span style="color: var(--text-dim);">Crafted with passion &amp; precision</span>  */}}
        </span>
      </div>

      <!-- Right: back to top -->
      <a href="#" class="footer-top-link flex items-center gap-2">
        {{ if eq .Site.Language.Lang "vi" }}Lên đầu trang{{ else }}Back to Top{{ end }}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </a>

    </div>
  </div>
</footer>
