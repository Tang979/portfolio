<section id="contact" class="py-28 relative contact-bg">
  <div class="max-w-4xl mx-auto px-6 text-center">
    <!-- Section label -->
    <div class="reveal flex justify-center mb-6">
      <span class="section-label">{{ .Params.contact.section_label }}</span>
    </div>

    <!-- Heading -->
    <h2
      class="reveal"
      style="
        font-size: clamp(2.2rem, 5vw, 3.8rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--text-primary);
        line-height: 1.1;
        margin-bottom: 1.25rem;
      "
    >
      {{ .Params.contact.heading }}<br />
      <span class="text-gradient">{{ .Params.contact.heading_gradient }}</span>
    </h2>

    <!-- Sub text -->
    <p
      class="reveal"
      style="
        font-size: 1.05rem;
        color: var(--text-secondary);
        max-width: 500px;
        margin: 0 auto 2.5rem;
        line-height: 1.75;
      "
    >
      {{ .Params.contact.subtext }}
    </p>

    <!-- Email CTA -->
    <div class="reveal mb-12">
      <a
        href="mailto:{{ .Params.contact.email }}"
        class="btn-primary"
        style="font-size: 1rem; padding: 1rem 2.25rem; gap: 0.6rem"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect width="20" height="16" x="2" y="4" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </svg>
        {{ if eq .Site.Language.Lang "vi" }}Gửi Email{{ else }}Send an Email{{ end }}
      </a>
    </div>

    <!-- Social links -->
    <div class="reveal flex justify-center gap-5 flex-wrap">
      <!-- GitHub -->
      <a
        href="{{ .Params.contact.social.github }}"
        target="_blank"
        rel="noopener"
        class="glass-card flex items-center gap-2.5"
        style="
          padding: 0.65rem 1.2rem;
          font-size: 0.82rem;
          font-weight: 500;
          color: var(--text-secondary);
        "
        onmouseover="this.style.color = '#f0f0f0'"
        onmouseout="this.style.color = 'var(--text-secondary)'"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"
          />
        </svg>
        GitHub
      </a>

      <!-- itch.io -->
      <a
        href="{{ .Params.contact.social.itchio }}"
        target="_blank"
        rel="noopener"
        class="glass-card flex items-center gap-2.5"
        style="
          padding: 0.65rem 1.2rem;
          font-size: 0.82rem;
          font-weight: 500;
          color: var(--text-secondary);
        "
        onmouseover="this.style.color = '#f0f0f0'"
        onmouseout="this.style.color = 'var(--text-secondary)'"
      >
        <span
          class="itch-icon"
          style="
            width: 20px;
            height: 20px;
            display: inline-block;
            background-color: currentColor; /* Tự động lấy màu theo chữ */
            -webkit-mask: url(&quot;/icon/icons8-itch-io-30.png&quot;)
              no-repeat center;
            mask: url(&quot;/icon/icons8-itch-io-30.png&quot;) no-repeat
              center;
            -webkit-mask-size: contain;
            mask-size: contain;
          "
        ></span>
        itch.io
      </a>

      <!-- LinkedIn -->
      <a
        href="{{ .Params.contact.social.linkedin }}"
        target="_blank"
        rel="noopener"
        class="glass-card flex items-center gap-2.5"
        style="
          padding: 0.65rem 1.2rem;
          font-size: 0.82rem;
          font-weight: 500;
          color: var(--text-secondary);
        "
        onmouseover="this.style.color = '#f0f0f0'"
        onmouseout="this.style.color = 'var(--text-secondary)'"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2zm2-6a2 2 0 0 1 0 4 2 2 0 0 1 0-4"
          />
        </svg>
        LinkedIn
      </a>
    </div>
  </div>
</section>
