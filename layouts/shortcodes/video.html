<div class="video-container" style="margin: 2rem 0;">
    <video 
        width="100%" 
        controls 
        preload="metadata" 
        style="border-radius: 12px; display: block;">
        <source src="{{ .Get "src" }}" type="video/mp4">
        {{ if eq .Site.Language.Lang "vi" }}Trình duyệt của bạn không hỗ trợ phát video.{{ else }}Your browser does not support video playback.{{ end }}
    </video>
</div>
